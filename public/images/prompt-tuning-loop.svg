<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 310" role="img" aria-labelledby="t">
  <title id="t">The prompt tuning loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: "DM Sans Variable", "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #000; text-anchor: middle; }
    .box { stroke: #000; stroke-width: 2; }
    .shadow { fill: #000; }
    .line { fill: none; stroke: #000; stroke-width: 2.5; marker-end: url(#a); }
  </style>
  <rect width="770" height="310" fill="#fff"/>
  <rect class="shadow" x="24" y="34" width="210" height="70" rx="5"/>
  <rect class="box" x="20" y="30" width="210" height="70" rx="5" fill="#dde9fe"/>
  <text x="125" y="71">1. Write prompt</text>
  <rect class="shadow" x="284" y="34" width="210" height="70" rx="5"/>
  <rect class="box" x="280" y="30" width="210" height="70" rx="5" fill="#fff"/>
  <text x="385" y="71">2. Run Prompt</text>
  <rect class="shadow" x="284" y="204" width="210" height="70" rx="5"/>
  <rect class="box" x="280" y="200" width="210" height="70" rx="5" fill="#fff"/>
  <text x="385" y="241">3. Evaluate</text>
  <rect class="shadow" x="24" y="204" width="210" height="70" rx="5"/>
  <rect class="box" x="20" y="200" width="210" height="70" rx="5" fill="#fff"/>
  <text x="125" y="241">4. Group Failures</text>
  <rect class="shadow" x="544" y="184" width="210" height="110" rx="5"/>
  <rect class="box" x="540" y="180" width="210" height="110" rx="5" fill="#5294ff"/>
  <text x="645" y="220">If accuracy doesn't</text>
  <text x="645" y="241">improve for 3</text>
  <text x="645" y="262">iterations, stop</text>
  <path class="line" d="M230 65 H276"/>
  <path class="line" d="M385 100 V196"/>
  <path class="line" d="M280 235 H234"/>
  <path class="line" d="M125 200 V104"/>
  <path class="line" d="M490 235 H536"/>
</svg>
