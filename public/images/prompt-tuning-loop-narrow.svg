<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 364" role="img" aria-labelledby="t">
  <title id="t">The prompt tuning loop</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>
  <style>
    text { font-family: "DM Sans Variable", "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #000; text-anchor: middle; }
    .box { stroke: #000; stroke-width: 2; }
    .shadow { fill: #000; }
    .line { fill: none; stroke: #000; stroke-width: 2.5; marker-end: url(#a); }
  </style>
  <rect width="380" height="364" fill="#fff"/>
  <rect class="shadow" x="14" y="14" width="160" height="64" rx="5"/>
  <rect class="box" x="10" y="10" width="160" height="64" rx="5" fill="#dde9fe"/>
  <text x="90" y="48">1. Write prompt</text>
  <rect class="shadow" x="214" y="14" width="160" height="64" rx="5"/>
  <rect class="box" x="210" y="10" width="160" height="64" rx="5" fill="#fff"/>
  <text x="290" y="48">2. Run Prompt</text>
  <rect class="shadow" x="214" y="134" width="160" height="64" rx="5"/>
  <rect class="box" x="210" y="130" width="160" height="64" rx="5" fill="#fff"/>
  <text x="290" y="168">3. Evaluate</text>
  <rect class="shadow" x="14" y="134" width="160" height="64" rx="5"/>
  <rect class="box" x="10" y="130" width="160" height="64" rx="5" fill="#fff"/>
  <text x="90" y="168">4. Group Failures</text>
  <rect class="shadow" x="214" y="254" width="160" height="100" rx="5"/>
  <rect class="box" x="210" y="250" width="160" height="100" rx="5" fill="#5294ff"/>
  <text x="290" y="286" style="font-size:15px">If accuracy doesn't</text>
  <text x="290" y="306" style="font-size:15px">improve for 3</text>
  <text x="290" y="326" style="font-size:15px">iterations, stop</text>
  <path class="line" d="M170 42 H206"/>
  <path class="line" d="M290 74 V126"/>
  <path class="line" d="M210 162 H174"/>
  <path class="line" d="M90 130 V78"/>
  <path class="line" d="M290 194 V246"/>
</svg>
